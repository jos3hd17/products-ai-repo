packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.11'
  - '@nestjs/core@11.2.11'
  - '@nestjs/platform-express@11.2.11'
  - '@nestjs/testing@11.2.11'
  - '@angular-devkit/architect@0.2203.0'
  - '@angular-devkit/core@22.3.0'
  - '@angular-devkit/schematics@22.3.0'
  - '@angular/build@22.3.0'
  - '@angular/cli@22.3.0'
  - '@angular/common@22.3.0'
  - '@angular/compiler-cli@22.3.0'
  - '@angular/compiler@22.3.0'
  - '@angular/core@22.3.0'
  - '@angular/forms@22.3.0'
  - '@angular/platform-browser@22.3.0'
  - '@angular/router@22.3.0'
  - '@schematics/angular@22.3.0'

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false

# Angular's optional Oxc WASM fallback pins incompatible emnapi peers. Native bindings remain required.
overrides:
  '@angular/build@22.3.0>@oxc-parser/binding-wasm32-wasi': '-'
