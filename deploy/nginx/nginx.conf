worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $api_upstream http://api:3000;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 32k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location ~ ^/(auth|products|docs)(/|$) {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Preserve browser Origin/CSRF/Cookie/Authorization; no cookie rewrites.
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_buffering off;
            add_header Cache-Control 'no-store' always;
        }
        location = /api-healthz { proxy_pass $api_upstream/healthz; }
        location = /config.js { add_header Cache-Control 'no-store' always; try_files $uri =404; }
        location = /index.html { add_header Cache-Control 'no-cache' always; }
        location ~* \.(?:js|css|woff2|png|svg|ico)$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
